$schema: https://raw.githubusercontent.com/matthewgetz/config/refs/tags/1.0.26/schema-spec.json
name: rotini
summary: Generate type-safe Go CLIs from a declarative spec.
description: rotini scaffolds and generates command-line programs from a .rotini.spec file, wiring typed inputs and lifecycle handlers for you.
inputs:
  flags:
    - name: help
      identifiers:
        - -h
        - --help
      schema:
        type: bool
    - name: version
      identifiers:
        - -v
        - --version
      schema:
        type: bool
commands:
  - name: initialize
    summary: Scaffold a new CLI under cmd/<name>.
    aliases:
      - init
    inputs:
      arguments:
        - name: name
          schema:
            type: string
      flags:
        - name: format
          identifiers:
            - --format
          schema:
            type: string
            description: Serialization for the scaffolded spec and conf.
            enum:
              - json
              - yaml
            default: yaml
        - name: force
          identifiers:
            - --force
          schema:
            type: bool
        - name: into
          identifiers:
            - --into
          schema:
            type: string
            description: Also compose the new CLI into this parent CLI.
        - name: help
          identifiers:
            - -h
            - --help
          schema:
            type: bool
  - name: generate
    summary: Generate framework + handler code from a spec.
    aliases:
      - gen
    inputs:
      arguments:
        - name: file
          schema:
            type: string
            default: .rotini.spec.yaml
      flags:
        - name: config
          identifiers:
            - -c
            - --config
          schema:
            type: string
        - name: help
          identifiers:
            - -h
            - --help
          schema:
            type: bool
        - name: watch
          identifiers:
            - --watch
            - -w
          schema:
            type: bool
  - name: validate
    summary: Validate a spec (and optional conf) against the schema.
    aliases:
      - val
    inputs:
      arguments:
        - name: file
          schema:
            type: string
            default: .rotini.spec.yaml
      flags:
        - name: help
          identifiers:
            - -h
            - --help
          schema:
            type: bool
  - name: help
    summary: Show help for a command.
    inputs:
      arguments:
        - name: command
          schema:
            type: array
      flags:
        - name: help
          identifiers:
            - -h
            - --help
          schema:
            type: bool
  - name: version
    summary: Print the rotini version.
    inputs:
      flags:
        - name: help
          identifiers:
            - -h
            - --help
          schema:
            type: bool
  - name: completion
    summary: Generate a shell completion script.
    inputs:
      arguments:
        - name: shell
          schema:
            type: string
            enum:
              - zsh
              - bash
              - fish
              - powershell
              - nushell
              - elvish
      flags:
        - name: help
          identifiers:
            - -h
            - --help
          schema:
            type: bool
metadata:
  - var: Version
    default: dev

$schema: https://raw.githubusercontent.com/go-rotini/rotini/refs/tags/0.0.0/schema-conf.json
initialize:
  package: cmd
  format: yaml
generate:
  packages:
    cli:
      package: internal/cmd/rotini
      file: rotini.gen.go
    cligen:
      package: internal/cmd/rotini
      file: rotini.gen.go
  features:
    help:
      enabled: true
      dir: internal/cmd/rotini/embed/help
    man:
      enabled: false
      dir: internal/cmd/rotini/embed/man
    completion:
      enabled: false
      dir: internal/cmd/rotini/embed/completion
validate:
  fail: collect

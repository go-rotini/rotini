$schema: https://raw.githubusercontent.com/go-rotini/rotini/refs/tags/0.0.0/schema-conf.json
generate:
  packages:
    cli:
      package: cmd/rotini/cli
      file: rotini.gen.go
    cligen:
      package: cmd/rotini/cli
      file: rotini.gen.go
  features:
    help:
      enabled: true
      dir: cmd/rotini/cli/embed/help
    man:
      enabled: false
      dir: cmd/rotini/cli/embed/man
    markdown:
      enabled: false
      dir: cmd/rotini/cli/embed/markdown
    completion:
      enabled: false
      dir: cmd/rotini/cli/embed/completion

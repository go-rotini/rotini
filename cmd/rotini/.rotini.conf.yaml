# yaml-language-server: $schema=../../schema-conf.json
version: 0.0.0
generate:
  # rotini publishes its own schemas at the MODULE ROOT, so a release tag serves them
  # at raw.githubusercontent.com/.../refs/tags/<tag>/schema-spec.json — the URL a user's
  # `$schema` key points at. TestPublishedSchemasInSync guards the copies.
  schemas:
    conf:
      file: schema-conf.json
    spec:
      file: schema-spec.json
  packages:
    - type: main
      file: cmd/rotini/main.go
      package: main
    - type: cmd
      file: internal/cmd/rotini/zz_rotini.go
      package: rotini
  features:
    - type: help
      enabled: true
      embed: false
      template: false
    # completion and man are inline, like help: `rotini completion` and `rotini man` print
    # what the generated Completion and Man return, and `rotini man --dir` writes ManPages.
    - type: completion
      enabled: true
      embed: false
      template: false
      # Messages for values with nothing to offer, such as the name `rotini init` takes.
      messages: all
      messages_env: ROTINI_COMPLETION_MESSAGES
    - type: man
      enabled: true
      embed: false
      template: false
    - type: markdown
      enabled: false
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
validate:
  fail: collect

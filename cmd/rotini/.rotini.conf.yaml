# yaml-language-server: $schema=../../schema-conf.json
version: 0.0.0
generate:
  # rotini publishes its own schemas at the MODULE ROOT, so a release tag serves them
  # at raw.githubusercontent.com/.../refs/tags/<tag>/schema-spec.json — the URL a user's
  # `$schema` key points at. TestPublishedSchemasInSync guards the copies.
  schemas:
    spec:
      file: schema-spec.json
    conf:
      file: schema-conf.json
  packages:
    - type: main
      file: cmd/rotini/main.go
      package: main
    - type: cmd
      file: internal/cmd/rotini/zz_rotini.go
      package: rotini
  features:
    - type: help
      enabled: true
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    - type: completion
      enabled: false
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    - type: man
      enabled: false
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    - type: markdown
      enabled: false
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
validate:
  fail: collect

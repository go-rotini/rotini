version: 0.0.0
generate:
  schemas:
    spec:
      path: cmd/rotini/.rotini-schema.spec.json
    conf:
      path: cmd/rotini/.rotini-schema.conf.json
  packages:
    - type: main
      file: cmd/rotini/main.go
      package: main
    - type: handlers
      file: internal/cmd/rotini/zz_rotini.go
      package: rotini
    - type: models
      file: internal/cmd/rotini/zz_rotini.go
      package: rotini
    # rotini's own dogfood points runtime_required at the embed source
    # (internal/runtime) — emission is skipped and the framework imports it
    # in place. A normal CLI would point this at a 'rotini' subpackage that
    # `rotini generate` writes the runtime into.
    - type: runtime_required
      file: internal/runtime/zz_runtime.go
      package: rotini
  features:
    - type: help
      enabled: true
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    - type: completion
      enabled: true
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    - type: man
      enabled: false
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    - type: markdown
      enabled: false
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
validate:
  fail: collect

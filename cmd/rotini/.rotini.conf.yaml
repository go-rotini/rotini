$schema: https://raw.githubusercontent.com/go-rotini/rotini/refs/tags/0.0.0/schema-conf.json
generate:
  packages:
    entrypoint:
      package: cmd/rotini
      file: main.go
    cmd:
      package: internal/cmd/rotini
      file: zz_rotini.gen.go
    cmdgen:
      package: internal/cmd/rotini
      file: zz_rotini.gen.go
  features:
    help:
      enabled: true
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    completion:
      enabled: true
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    man:
      enabled: false
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    markdown:
      enabled: false
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
validate:
  fail: collect

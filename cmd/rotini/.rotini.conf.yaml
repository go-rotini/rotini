# yaml-language-server: $schema=./.rotini-schema.conf.json
version: 0.0.0
generate:
  schemas:
    spec:
      path: cmd/rotini/.rotini-schema.spec.json
    conf:
      path: cmd/rotini/.rotini-schema.conf.json
  packages:
    entrypoint:
      package: cmd/rotini
      file: main.go
    cmd:
      package: internal/cmd/rotini
      file: zz_rotini.go
    cmdgen:
      package: internal/cmd/rotini
      file: zz_rotini.go
  features:
    help:
      enabled: true
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    completion:
      enabled: true
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    man:
      enabled: false
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
    markdown:
      enabled: false
      embed: false
      embed_dir: internal/cmd/rotini/renders
      template: false
      template_dir: internal/cmd/rotini/templates
validate:
  fail: collect

name: repeated-flag-accumulates
description: Two occurrences of the same bool flag accumulate into a []any.
spec:
  name: myprog
  flags:
    - name: verbose
      identifiers: ["-v", "--verbose"]
      type: bool
inputs:
  argv: ["-v", "-v"]
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      verbose: [true, true]
  stdin: null

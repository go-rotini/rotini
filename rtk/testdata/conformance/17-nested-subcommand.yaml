name: nested-subcommand
description: A two-level nested command path is walked correctly.
spec:
  name: myprog
  commands:
    - name: remote
      path: remote
      commands:
        - name: add
          path: remote-add
inputs:
  argv: ["remote", "add"]
expected:
  command_path: ["remote", "add"]
  parsed_args: []
  flags_by_scope:
    "": {}
    remote: {}
    add: {}
  stdin: null

name: error-too-many-args
description: Extra positionals when no variadic argument is declared surface an error.
spec:
  name: myprog
  commands:
    - name: greet
      path: greet
      arguments:
        - name: who
          type: string
inputs:
  argv: ["greet", "alice", "bob"]
expected:
  error_contains: "too many arguments"

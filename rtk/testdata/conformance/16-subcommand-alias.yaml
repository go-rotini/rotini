name: subcommand-alias
description: Argv invokes a subcommand by one of its aliases.
spec:
  name: myprog
  commands:
    - name: list
      path: list
      aliases: ["ls", "l"]
inputs:
  argv: ["ls"]
expected:
  command_path: ["list"]
  parsed_args: []
  flags_by_scope:
    "": {}
    list: {}
  stdin: null

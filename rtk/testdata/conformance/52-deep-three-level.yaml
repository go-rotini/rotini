name: deep-three-level
description: A three-deep command path resolves correctly with per-level flags.
spec:
  name: myprog
  flags:
    - name: verbose
      identifiers: ["-v", "--verbose"]
      type: bool
  commands:
    - name: foo
      path: foo
      flags:
        - name: fopt
          identifiers: ["--fopt"]
          type: string
      commands:
        - name: bar
          path: foo-bar
          commands:
            - name: baz
              path: foo-bar-baz
              flags:
                - name: depth
                  identifiers: ["-d"]
                  type: int
inputs:
  argv: ["-v", "foo", "--fopt", "x", "bar", "baz", "-d", "3"]
expected:
  command_path: ["foo", "bar", "baz"]
  parsed_args: []
  flags_by_scope:
    "":
      verbose: true
    foo:
      fopt: "x"
    bar: {}
    baz:
      depth: 3
  stdin: null

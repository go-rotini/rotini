name: stdin-jsonc
description: JSONC-format stdin tolerates comments and is exposed as map[string]any.
spec:
  name: myprog
  root_stdin:
    format: "jsonc"
  flags:
    - name: help
      identifiers: ["--help"]
      type: bool
inputs:
  argv: ["--help"]
  stdin: |
    {
      // a comment
      "name": "rotini",
      "count": 42
    }
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      help: true
  stdin:
    name: "rotini"
    count: 42

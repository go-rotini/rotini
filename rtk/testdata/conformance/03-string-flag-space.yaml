name: string-flag-space
description: A string flag with value supplied in the next argv token.
spec:
  name: myprog
  flags:
    - name: output
      identifiers: ["-o", "--output"]
      type: string
inputs:
  argv: ["--output", "json"]
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      output: "json"
  stdin: null

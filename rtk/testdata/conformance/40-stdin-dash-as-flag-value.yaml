name: stdin-dash-as-flag-value
description: A `-` flag value is substituted with the stdin content.
spec:
  name: myprog
  commands:
    - name: send
      path: send
      flags:
        - name: body
          identifiers: ["-b"]
          type: string
inputs:
  argv: ["send", "-b", "-"]
  stdin: "the message body"
expected:
  command_path: ["send"]
  parsed_args: []
  flags_by_scope:
    "": {}
    send:
      body: "the message body"
  stdin: null

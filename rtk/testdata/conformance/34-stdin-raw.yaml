name: stdin-raw
description: Raw-format stdin is exposed as a byte slice with no transformation.
spec:
  name: myprog
  root_stdin:
    format: "raw"
  flags:
    - name: help
      identifiers: ["--help"]
      type: bool
inputs:
  argv: ["--help"]
  stdin: "binary\n"
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      help: true
  stdin: "binary\n"

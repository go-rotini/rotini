name: flag-config-fallback
description: An absent flag with a ConfigKey falls back to the config value.
spec:
  name: myprog
  flags:
    - name: output
      identifiers: ["-o", "--output"]
      type: string
      default: "default-loses"
      config_key: "defaults.output"
    - name: help
      identifiers: ["--help"]
      type: bool
inputs:
  argv: ["--help"]
  config:
    defaults:
      output: "config-wins"
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      output: "config-wins"
      help: true
  stdin: null

name: min-length-ok
description: A min-length-constrained string flag with a value at the boundary.
spec:
  name: myprog
  flags:
    - name: name
      identifiers: ["--name"]
      type: string
      min_length: 3
inputs:
  argv: ["--name", "abc"]
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      name: "abc"
  stdin: null

name: flag-default-fallback
description: An absent flag with a Default falls back to that default.
spec:
  name: myprog
  flags:
    - name: output
      identifiers: ["-o", "--output"]
      type: string
      default: "table"
    - name: help
      identifiers: ["--help"]
      type: bool
inputs:
  argv: ["--help"]
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      output: "table"
      help: true
  stdin: null

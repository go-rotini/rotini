name: argv-beats-env-config-default
description: Argv shadows env, config, and default in the precedence chain.
spec:
  name: myprog
  flags:
    - name: output
      identifiers: ["-o", "--output"]
      type: string
      default: "default-loses"
      env_key: "MYPROG_OUTPUT"
      config_key: "defaults.output"
inputs:
  argv: ["--output", "argv-wins"]
  env:
    MYPROG_OUTPUT: "env-loses"
  config:
    defaults:
      output: "config-loses"
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      output: "argv-wins"
  stdin: null

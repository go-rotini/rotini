name: error-pattern-mismatch
description: A string value that doesn't match the declared pattern surfaces ValidationError.
spec:
  name: myprog
  flags:
    - name: ip
      identifiers: ["--ip"]
      type: string
      pattern: "[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+"
inputs:
  argv: ["--ip", "not-an-ip"]
expected:
  error_contains: "does not match pattern"

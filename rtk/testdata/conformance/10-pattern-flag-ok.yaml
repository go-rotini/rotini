name: pattern-flag-ok
description: A pattern-constrained string flag with a value that matches.
spec:
  name: myprog
  flags:
    - name: ip
      identifiers: ["--ip"]
      type: string
      pattern: "[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+"
inputs:
  argv: ["--ip", "10.0.0.1"]
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      ip: "10.0.0.1"
  stdin: null

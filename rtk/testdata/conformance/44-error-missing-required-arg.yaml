name: error-missing-required-arg
description: A required positional that's not supplied surfaces MissingRequiredError.
spec:
  name: myprog
  commands:
    - name: greet
      path: greet
      arguments:
        - name: who
          type: string
          required: true
inputs:
  argv: ["greet"]
expected:
  command_path: ["greet"]
  error_contains: "required"

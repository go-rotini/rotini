name: positional-after-double-dash
description: Tokens after `--` are treated as positionals, even if flag-like.
spec:
  name: myprog
  commands:
    - name: run
      path: run
      arguments:
        - name: cmd
          type: string
          variadic: true
inputs:
  argv: ["run", "--", "--not-a-flag", "-x", "value"]
expected:
  command_path: ["run"]
  parsed_args: ["--not-a-flag", "-x", "value"]
  flags_by_scope:
    "": {}
    run: {}
  stdin: null

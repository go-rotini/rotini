name: single-subcommand
description: Argv matches a top-level subcommand with no further flags or args.
spec:
  name: myprog
  commands:
    - name: list
      path: list
inputs:
  argv: ["list"]
expected:
  command_path: ["list"]
  parsed_args: []
  flags_by_scope:
    "": {}
    list: {}
  stdin: null

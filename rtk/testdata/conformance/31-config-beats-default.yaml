name: config-beats-default
description: Config shadows default when argv and env are absent.
spec:
  name: myprog
  flags:
    - name: output
      identifiers: ["-o", "--output"]
      type: string
      default: "default-loses"
      config_key: "output"
    - name: help
      identifiers: ["--help"]
      type: bool
inputs:
  argv: ["--help"]
  config:
    output: "config-wins"
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      output: "config-wins"
      help: true
  stdin: null

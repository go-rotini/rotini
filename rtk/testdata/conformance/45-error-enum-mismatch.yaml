name: error-enum-mismatch
description: A flag value outside the declared enum surfaces ValidationError.
spec:
  name: myprog
  flags:
    - name: output
      identifiers: ["-o", "--output"]
      type: string
      enum: ["table", "json", "yaml"]
inputs:
  argv: ["--output", "xml"]
expected:
  error_contains: "allowed values"

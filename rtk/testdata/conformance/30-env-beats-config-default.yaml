name: env-beats-config-default
description: Env shadows config and default when argv is absent.
spec:
  name: myprog
  flags:
    - name: output
      identifiers: ["-o", "--output"]
      type: string
      default: "default-loses"
      env_key: "MYPROG_OUTPUT"
      config_key: "output"
    - name: help
      identifiers: ["--help"]
      type: bool
inputs:
  argv: ["--help"]
  env:
    MYPROG_OUTPUT: "env-wins"
  config:
    output: "config-loses"
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      output: "env-wins"
      help: true
  stdin: null

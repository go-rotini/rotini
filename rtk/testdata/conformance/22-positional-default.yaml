name: positional-default
description: An absent positional argument with a default falls back to it.
spec:
  name: myprog
  commands:
    - name: greet
      path: greet
      arguments:
        - name: who
          type: string
          default: "stranger"
inputs:
  argv: ["greet"]
expected:
  command_path: ["greet"]
  parsed_args: ["stranger"]
  flags_by_scope:
    "": {}
    greet: {}
  stdin: null

name: stdin-yaml
description: YAML-format stdin is exposed as map[string]any.
spec:
  name: myprog
  root_stdin:
    format: "yaml"
  flags:
    - name: help
      identifiers: ["--help"]
      type: bool
inputs:
  argv: ["--help"]
  stdin: "name: rotini\ncount: 42\n"
expected:
  command_path: []
  parsed_args: []
  flags_by_scope:
    "":
      help: true
  stdin:
    name: "rotini"
    count: 42

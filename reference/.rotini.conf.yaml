# .rotini.conf.yaml — EXHAUSTIVE REFERENCE
# ---------------------------------------------------------------------------
# Demonstrates every key and shape accepted by internal/schema-conf.json —
# the conf twin of .rotini.spec.yaml, same discipline. A documentation
# artifact: keys shown commented-out are valid in the schema but rejected by
# rotini validation in that position (each called out inline).
#
# STATUS LEGEND:
#   (no marker)        — implemented, linted, tested; the shape is FIRM.
#   ⚠ PARTIAL / CAVEAT — implemented, with a DELIBERATE, documented limitation.
#   ✘ NOT IMPLEMENTED  — schema-accepted, no consumer. NONE REMAIN (the
#                        spec-fidelity effort closed 2026-06-12); the marker
#                        is kept for future audits — any new ✘ is a new work
#                        item by definition.
# ---------------------------------------------------------------------------

# REQUIRED. The MINIMUM rotini this conf requires. Any binary of the same major
# at or beyond it is accepted, so a patch or minor upgrade does not force an edit
# here; an older binary, or a different major, is an error. Skipped for a dev
# build with no version stamped in.
version: 0.0.0

# OPTIONAL, and for your EDITOR only — rotini never fetches it. Any URI works; the
# released form points at a tag (note the 'v'). `generate.schemas.conf.file` below
# writes a local copy you can point at instead. A
# `# yaml-language-server: $schema=<path>` comment does the same job.
$schema: https://raw.githubusercontent.com/go-rotini/rotini/refs/tags/v0.0.0/schema-conf.json

# ===========================================================================
# generate — controls `rotini generate`: where code is written (packages) and
# which derived outputs are emitted (features).
# ===========================================================================
generate:
  packages:
    # A LIST of generated code targets, one per `type`. Every entry shares three
    # fields:
    #   type    — REQUIRED. One of: main | cmd | models. Each type may appear at most
    #             ONCE (cross-item lint; the schema enums the value but can't bound
    #             the count). `models` is OPTIONAL — see below.
    #   file    — module-root-relative path ending in .go; its parent directory is
    #             the target package directory. `cmd` defaults to
    #             'internal/cmd/<root>/zz_rotini.gen.go'; main has no default.
    #   package — Go package name at the top of `file`. Defaults to the directory's
    #             last segment (sanitized). For type:main it MUST be 'main' (schema-
    #             enforced via const). Targets that resolve to the SAME file must
    #             declare the same package (cross-item lint).
    #
    # The rotini RUNTIME is NOT generated: it is an ordinary library dependency the
    # generated code imports (`go get github.com/go-rotini/rotini`), so no target
    # here decides where it lands. By default everything rotini writes for THIS cli —
    # the typed inputs, the Definition, the rollup, and the editable handler stubs —
    # lands in the one `cmd` package.
    - type: main                       # the binary entrypoint (main.go) — CREATE-ONCE:
      file: cmd/acme/main.go           # never overwritten after the first pass. `file`
      package: main                    # is REQUIRED for it to be written (no default dir).
      keep: [extra.go]                 # spares hand-written .go in the dir from pruning;
                                       # with no `file`, keep is inert → REJECTED (lintEntrypoint).

    - type: cmd                        # the cli package: the editable per-command handler
      file: internal/cmd/acme/zz_rotini.gen.go  # stubs PLUS the ONE generated file — the typed
      package: acme                    # input/output structs (Collect[T]/Parse* targets), the
      keep:                            # Definition literal, NewProgram, BindMeta,
        - helpers.go                   # ProgramHandlers, feature embeds, and the handlers
                                       # rollup, all merged. rotini-managed files that no
                                       # longer map to a command are PRUNED each pass; keep
                                       # spares hand-written paths in the same directory.

    # There is NO `runtime` target. The rotini runtime is an ordinary library the
    # generated code imports (`go get github.com/go-rotini/rotini`), not emitted
    # code — so nothing here decides where it lands. See ROTINI_DIRECTION.md.

  features:
    # A LIST of derived outputs, one per `type` (help | completion | man | markdown).
    # Each type may appear at most once. A feature is a toggle + two orthogonal
    # strategy knobs + two dirs. The booleans default FALSE (a minimal, self-
    # contained .go); the dirs (omittable — defaults shown) say WHERE:
    #   enabled      — opt-in only (Pillar 1): generate this feature's outputs.
    #   embed        — true: render to a file in `embed_dir` sourced via //go:embed;
    #                  that dir must resolve UNDER the framework package (lint-enforced,
    #                  since //go:embed can't reach outside it). false (default): no
    #                  file — an inline string literal in the .go.
    #   embed_dir    — where rendered OUTPUT files (help_*.txt / man_*.txt /
    #                  markdown_*.md / completion_<shell>.txt) are written in embed
    #                  mode. Default '<framework-package>/renders'. Unused in inline
    #                  mode — validation WARNS (non-fatal) if set there.
    #   template     — true: seed the editable rendering template (help.txt.tmpl /
    #                  man.txt.tmpl / markdown.md.tmpl) for customization. false
    #                  (default): render from rotini's built-in default; no template
    #                  seeded (an already-edited one is left in place, inert). No
    #                  effect on completion (no template) — validation WARNS.
    #   template_dir — where the editable template is seeded. Never //go:embed'd, so
    #                  UNCONSTRAINED. Default '<framework-package>/templates'. Unused
    #                  when no template is seeded (template:false / completion) — WARNS.
    - type: help
      enabled: true                    # opt-in only (Pillar 1): false by default
      embed: false                     # inline string literal in the .go (default)
      template: false                  # render from the built-in default (default)
      # embed_dir / template_dir are INERT in this quadrant (inline + no template):
      # validation WARNS if you set a dir its mode ignores. See man/markdown below
      # for embed_dir/template_dir shown in their valid (embed:true / template:true) modes.
    - type: man
      enabled: true
      embed: true                      # //go:embed a man_*.txt file (embed_dir under framework)
      embed_dir: internal/cmd/acme/renders
      template: true                   # seed man.txt.tmpl for editing
      template_dir: internal/cmd/acme/templates
    - type: completion
      enabled: true                    # per-shell scripts (bash/zsh/fish/pwsh) that
      embed: true                      # call the binary's hidden __complete entry;
      embed_dir: internal/cmd/acme/renders   # completion CAN embed its scripts (embed mode)
      # template / template_dir are INERT — completion has no editable template;
      # validation WARNS if you set them here. Candidates ride as `name\tsummary` (R4) —
      # zsh/fish/pwsh render the description, bash strips it; enum values stay bare
    - type: markdown                   # the 4th doc feature: per-command reference
      enabled: true                    # .md pages (markdown_*.md), render-or-verbatim
      embed: true                      # like help/man (editable markdown.md.tmpl;
      embed_dir: internal/cmd/acme/renders   # `markdown:` on a command = verbatim escape).
      template: true                   # Build-time docs feedstock — NO run-time
      template_dir: internal/cmd/acme/templates   # command serves it (unlike help/man/
                                       # completion, which a command's handler can render).

# ===========================================================================
# validate — how `rotini validate` reports problems. Strictness itself is
# fixed (validation is always strict); only reporting is configurable, and
# the --fail flag overrides this.
# ===========================================================================
validate:
  fail: collect                        # collect = report every problem at once
                                       # (default) | fast = stop at the first
  # Problem shape (R5-S3): pointer-shaped problems carry the source position —
  # `spec: <file>:<line>:<col>: /command/...: <msg>` — for yaml/json/jsonc
  # documents (yaml via the AST; jsonc positions match the bytes you typed,
  # comments included). TOML has no position support and degrades to the
  # pointer alone. Semantic lint locs ("command acme deploy") are unchanged.

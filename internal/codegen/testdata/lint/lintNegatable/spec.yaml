# The negated form sets a bool FALSE, so negatable needs a bool with a long identifier to
# derive "--no-<x>" from (or a custom form of its own), and the negated form must not collide
# with a real identifier or another flag's negated form.
version: 0.0.0
command:
  name: demo
  flags:
    # Not a bool: there is nothing for "--no-" to set false.
    - name: level
      identifiers:
        - --level
      schema:
        type: int
        negatable: true
    # No long identifier: nothing to derive the negated form from.
    - name: quiet
      identifiers:
        - -q
      schema:
        type: bool
        negatable: true
    # The derived "--no-cache" collides with a flag that really declares it.
    - name: cache
      identifiers:
        - --cache
      schema:
        type: bool
        negatable: true
    - name: nocache
      identifiers:
        - --no-cache
      schema:
        type: bool
    # Fine: a custom negated form, set on --color as --plain.
    - name: color
      identifiers:
        - --color
      schema:
        type: bool
        negatable: --plain
    # A custom form a flag already declares, and one another flag's negated form also uses.
    - name: verbose
      identifiers:
        - --verbose
      schema:
        type: bool
        negatable: --name
    - name: name
      identifiers:
        - --name
      schema:
        type: string
    - name: fancy
      identifiers:
        - --fancy
      schema:
        type: bool
        negatable: --plain

# A see_also entry naming one of the program's own pages must name a page it writes, in the
# section the man pages are written in, and a command or topic reference one the program has.
version: 0.0.0
command:
  name: demo
  topics:
    - name: filters
      summary: how filters work
      body: Filters narrow a list.
  see_also:
    # Correct: a command page, a topic page, another program's page, and a URL. No problem.
    - demo-list(8)
    - demo-filters(8)
    - git(1)
    - https://example.com/demo
    # Wrong: no such page, and the wrong section.
    - demo-lst(8)
    - demo-list(1)
  commands:
    - name: list
      see_also:
        # Correct: a command, a topic and a URL. No problem.
        - demo(8)
        - { command: remote add }
        - { topic: filters }
        - { url: https://example.com/demo }
        # Wrong: no such command, and no such topic.
        - { command: remote ad }
        - { topic: filter }
    - name: remote
      commands:
        - name: add

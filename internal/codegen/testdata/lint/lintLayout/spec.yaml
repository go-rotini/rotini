# layout says how a TIME is written, in Go's reference-time notation. It means nothing on a
# non-time input, and a layout with no part of the reference time can never match a value —
# the classic case is YYYY-MM-DD, which Go reads as literal text.
version: 0.0.0
command:
  name: demo
  flags:
    - name: name
      identifiers: [--name]
      schema:
        type: string
        layout: '2006-01-02'
    - name: due
      identifiers: [--due]
      schema:
        type: date
        layout: YYYY-MM-DD
    # Fine: a date, a custom layout, Unix seconds, and a list of dates.
    - name: day
      identifiers: [--day]
      schema:
        type: date
        default: '2026-09-29'
    - name: at
      identifiers: [--at]
      schema:
        type: datetime
        layout: 'Jan 2 2006 15:04'
    - name: since
      identifiers: [--since]
      schema:
        type: time
        layout: unix
    - name: holidays
      identifiers: [--holiday]
      schema:
        type: '[]date'
    # Fine: a list of layouts, the most specific first.
    - name: when
      identifiers: [--when]
      schema:
        type: time
        layout: ['2006-01-02 15:04', '2006-01-02', unix]
    # A layout listed after one that reads its values as a different time: unix reads a year
    # such as 2019 as seconds since 1970, so the year layout is never reached. A bad entry in a
    # list is reported as a single layout is.
    - name: year
      identifiers: [--year]
      schema:
        type: time
        layout: [unix, '2006']
    - name: bad
      identifiers: [--bad]
      schema:
        type: time
        layout: ['2006-01-02', YYYY]

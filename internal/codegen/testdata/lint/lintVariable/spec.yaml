# variable: names the exact environment variable an input reads. Env inputs, flags and
# arguments (as their fallback) act on it; on a config input it would be silently ignored, which
# is what validation exists to prevent.
#
# The legal uses are below too, so this fixture also pins that they are NOT rejected.
version: 0.0.0
command:
  name: demo
  flags:
    - name: token
      identifiers:
        - --token
      schema:
        type: string
        variable: GITHUB_TOKEN
  env:
    - name: region
      schema:
        type: string
        variable: ACME_REGION
  arguments:
    - name: target
      schema:
        type: string
        variable: DEMO_TARGET
  config:
    - name: timeout
      schema:
        type: duration
        key: timeout
        variable: ALSO_NOPE

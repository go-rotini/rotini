# variable: names the exact environment variable an input reads. Only the two channels with
# an environment — env inputs and flags — can act on it; on an argument or a config input it
# would be silently ignored, which is what validation exists to prevent.
#
# The legal uses are below too, so this fixture also pins that they are NOT rejected.
version: 0.0.0
command:
  name: demo
  flags:
    - name: token
      identifiers:
        - --token
      schema:
        type: string
        variable: GITHUB_TOKEN
  env:
    - name: region
      schema:
        type: string
        variable: ACME_REGION
  arguments:
    - name: target
      schema:
        type: string
        variable: NOPE
  config:
    - name: timeout
      schema:
        type: duration
        key: timeout
        variable: ALSO_NOPE

# A default or implicit_value the input's own type cannot hold validated clean before, then made
# every run that took it fail with a usage error about a value the user never typed.
version: 0.0.0
command:
  name: demo
  flags:
    - name: port
      identifiers: [--port]
      schema:
        type: int
        default: abc
    - name: wait
      identifiers: [--wait]
      schema:
        type: duration
        default: 5
    - name: limits
      identifiers: [--limit]
      schema:
        type: '[]bytesize'
        default: [1Gi, lots]
    - name: level
      identifiers: [--level]
      schema:
        type: int
        implicit_value: max
    # Fine: values the runtime accepts, including its newer spellings.
    - name: cache
      identifiers: [--cache]
      schema:
        type: bool
        default: 'off'
    - name: ttl
      identifiers: [--ttl]
      schema:
        type: duration
        default: 7d
    - name: labels
      identifiers: [--label]
      schema:
        type: 'map[string]int'
        default: {a: 1, b: 2}
    - name: token
      identifiers: [--token]
      schema:
        type: uuid.UUID
        import: github.com/google/uuid
        default: not-checked-here
  arguments:
    - name: count
      schema:
        type: uint
        default: -1

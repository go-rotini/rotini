# A count flag has no value: every value-shaped key is meaningless on it.
version: 0.0.0
command:
  name: demo
  flags:
    - name: verbose
      identifiers:
        - -v
        - --verbose
      schema:
        type: count
        default: 1
        required: true
    - name: level
      identifiers:
        - --level
      schema:
        type: count
        base: prefixed

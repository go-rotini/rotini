# The completion hint describes a value typed on the COMMAND LINE, so it belongs to flags and
# arguments. Elsewhere — or on a flag that takes no value — it would be silently ignored.
version: 0.0.0
command:
  name: demo
  flags:
    # A bool takes no value, so there is nothing to complete.
    - name: force
      identifiers:
        - --force
      schema:
        type: bool
        complete:
          kind: file
    # extensions narrow FILES; with kind directory they mean nothing.
    - name: out
      identifiers:
        - --out
      schema:
        type: string
        complete:
          kind: directory
          extensions:
            - yaml
    # A message is one line; a shell shows it as a single line.
    - name: service
      identifiers:
        - --service
      schema:
        type: string
        complete:
          message: "a service name\nfrom deploy.yaml"
    # Correct: a message alone, no kind. No problem.
    - name: target
      identifiers:
        - --target
      schema:
        type: string
        complete:
          message: a deploy target
    # A message on a bool flag has nothing to complete either.
    - name: dry
      identifiers:
        - --dry
      schema:
        type: bool
        complete:
          message: no value here
  env:
    # No shell is doing the typing here.
    - name: region
      schema:
        type: string
        complete:
          kind: file
  arguments:
    # A number can't be a command path.
    - name: depth
      schema:
        type: int
        complete:
          kind: command
    # The command names are the candidates, so the enum would never be offered.
    - name: topic
      schema:
        type: string
        enum: [a, b]
        complete:
          kind: command
    # A number can't be a user name: a warning.
    - name: uid
      schema:
        type: int
        complete:
          kind: user
    # Correct: a help command's argument.
    - name: command
      schema:
        type: array
        items:
          type: string
        complete:
          kind: command
  commands:
    - name: run
      flags:
        # A flag's value isn't a command path.
        - name: target
          identifiers: [--target]
          schema:
            type: string
            complete:
              kind: command
        # Correct: a program name.
        - name: shell
          identifiers: [--shell]
          schema:
            type: string
            complete:
              kind: executable

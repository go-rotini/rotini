# Exactly one of path/discover, the xdg strategy needs an app directory, and discover looks
# for a file name, not a path. The names the configuration reader keeps for its own layers are
# refused.
version: 0.0.0
command:
  name: demo
  config_files:
    - name: both
      path: ./a.yaml
      discover:
        strategy: walk-up
        file: .demo.yaml
    - name: xdgnoapp
      discover:
        strategy: xdg
        file: config.yaml
    - name: nested
      discover:
        strategy: walk-up
        file: conf/demo.yaml
    - name: windows
      discover:
        strategy: walk-up
        file: conf\demo.yaml
    - name: parent
      discover:
        strategy: walk-up
        file: ..
    - name: dotted
      discover:
        strategy: walk-up
        file: .demo.d...yaml
    - name: explicit
      path: ./explicit.json
    - name: default
      path: ./default.yaml

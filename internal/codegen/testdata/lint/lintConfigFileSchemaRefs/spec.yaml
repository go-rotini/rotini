# A config file's schema naming an undeclared schema.
version: 0.0.0
command:
  name: demo
  schemas:
    Settings:
      type: object
      properties:
        port: { type: integer }
  config_files:
    # Correct: a declared schema. No problem.
    - name: app
      path: ./app.yaml
      schema: { $ref: Settings }
    # Wrong: an undeclared schema, at the top and nested.
    - name: user
      path: ./user.yaml
      schema: { $ref: Setings }
    - name: team
      path: ./team.yaml
      schema:
        type: object
        properties:
          members: { type: array, items: { $ref: Member } }

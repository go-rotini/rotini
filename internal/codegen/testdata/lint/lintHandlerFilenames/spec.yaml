# Two commands resolving to one stub file would have codegen write over itself, and a
# name the go tool reads specially would silently break the build. A file name longer than a
# file system allows can't be created at all.
version: 0.0.0
command:
  name: demo
  commands:
    - name: build
      filename: shared.go
    - name: ship
      filename: shared.go
    - name: probe
      filename: probe_test.go
    # demo_aB.go and demo_ab.go are one file on macOS and Windows.
    - name: aB
    - name: ab
    - name: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# The shape `rotini init` seeded before v1.3: --help cascades but is not short_circuit. A
# project that doesn't opt in keeps the stubs v1.2.0 wrote, plus checks on its stdout writes;
# want/ is edited by hand and never rewritten by -update-stubshapes.
version: 1.2.0
command:
  name: demo
  summary: a demo
  flags:
    - name: help
      identifiers: [-h, --help]
      cascading: true
      schema: { type: bool }
    - name: version
      identifiers: [-v, --version]
      schema: { type: bool }
  commands:
    - name: build
      summary: build it
      arguments:
        - name: target
          schema: { type: string, required: true }
    - name: help
      summary: print help
      arguments:
        - name: command
          schema: { type: '[]string' }
    - name: version
      summary: print version

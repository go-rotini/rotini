# Gemini CLI policy generated by rotini from the commands' effects. Copy this file to
# ~/.gemini/policies/.

[[rule]]
toolName = "run_shell_command"
commandRegex = "^(taskr\\s+list|taskr\\s+ls)(\\s|$)"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
commandRegex = "^taskr\\s+purge(\\s|$)"
decision = "ask_user"
priority = 200

[[rule]]
toolName = "run_shell_command"
commandRegex = "^taskr\\s+remote\\s+sync\\s(.*\\s)?--prune(\\s|=|$)"
decision = "ask_user"
priority = 200

[[rule]]
toolName = "run_shell_command"
commandRegex = "^taskr\\s+remote\\s+show(\\s|$)"
decision = "allow"
priority = 100

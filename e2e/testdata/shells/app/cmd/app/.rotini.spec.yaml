version: 0.0.0
command:
  name: app
  summary: a CLI with every kind of completion
  flags:
    - name: config
      cascading: true
      summary: config file
      identifiers: [--config]
      schema:
        type: string
        complete: { kind: file, extensions: [yaml, yml] }
    - name: dir
      cascading: true
      summary: work directory
      identifiers: [--dir]
      schema:
        type: string
        complete: { kind: directory }
    - name: token
      cascading: true
      summary: API token
      identifiers: [--token]
      schema:
        type: string
        complete: { kind: none, message: "an API token, from your account page" }
    - name: exec
      cascading: true
      summary: program to run
      identifiers: [--exec]
      schema:
        type: string
        complete: { kind: executable }
    - name: user
      cascading: true
      summary: account to run as
      identifiers: [--user]
      schema:
        type: string
        complete: { kind: user }
    - name: group
      cascading: true
      summary: group to run as
      identifiers: [--group]
      schema:
        type: string
        complete: { kind: group }
    - name: host
      cascading: true
      summary: host to reach
      identifiers: [--host]
      schema:
        type: string
        complete: { kind: host }
    - name: level
      cascading: true
      summary: how much to say
      identifiers: [--level]
      schema:
        type: string
        enum:
          - { value: medium, summary: the default }
          - { value: low, summary: quiet }
          - { value: high, summary: loud }
    - name: format
      cascading: true
      summary: output format
      identifiers: [--format]
      schema:
        type: string
        enum: [json, text, yaml]
    - name: speed
      cascading: true
      summary: how fast to go
      identifiers: [--speed]
      schema:
        type: string
        enum: [fast, slow, Safe]
        ignore_case: true
    - name: set
      cascading: true
      summary: override a setting
      identifiers: [--set]
      schema:
        type: map
        properties:
          image: { type: string }
          replicas: { type: string }
    - name: color
      cascading: true
      summary: colorize output
      identifiers: [--color]
      schema: { type: bool, negatable: true }
  commands:
    - name: quote
      summary: values a shell must insert as one literal word
      flags:
        - name: odd
          summary: values holding shell syntax
          identifiers: [--odd]
          schema:
            type: string
            enum:
              - "a b"
              - "it's $HOME"
              - 'say "hi"'
              - "`touch pwned`"
              - "$(touch pwned)"
              - "x;touch pwned"
              - "star*"
              - "~root"
              - "o’neil;touch pwned"
              - "“q”"
              - 'back\slash'
              - 'a\:b'
              - { value: 'C:\Users\me', summary: 'a path: C:\Users\me' }
              - "a!b"
              - "ends'"
              - "{a,b}"
              - "a&b|c<d>e"
              - "#hash"
              - "true"
              - "null"
              - "-foo.bar"
              - "--%"
              - "–a.b"
              - "-a:"
        - name: pair
          summary: values sharing a prefix up to a shell character
          identifiers: [--pair]
          schema:
            type: string
            enum: ["x;touch pwned", "x;touch pwnedz", "x y", "x,y"]
        - name: addr
          summary: values with a colon, a word break in bash
          identifiers: [--addr]
          schema:
            type: string
            enum: ["host:8080", "host:9090"]
        - name: note
          summary: a value with no completion hint
          identifiers: [--note]
          schema: { type: string }
    - name: deploy
      summary: deploy a service
      flag_groups:
        - { kind: mutually_exclusive, flags: [quiet, verbose] }
      flags:
        - name: env
          summary: target environment
          identifiers: [--env]
          schema:
            type: string
            required: true
            enum: [dev, prod]
        - name: quiet
          summary: say nothing
          identifiers: [--quiet]
          schema: { type: bool }
        - name: verbose
          summary: say everything
          identifiers: [--verbose]
          schema: { type: bool }
      arguments:
        - name: service
          summary: the service to deploy
          schema: { type: string }
    - name: status
      summary: show status
    - name: remote
      summary: manage remotes
      commands:
        - name: add
          summary: add a remote
        - name: remove
          summary: remove a remote
    - name: help
      summary: print help
      arguments:
        - name: command
          summary: the command to describe
          schema:
            type: '[]string'
            complete: { kind: command }

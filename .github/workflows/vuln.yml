# A new advisory for the standard library or a dependency can land between pushes; this scan
# finds it within a week instead of on the next push.
name: Vulnerability scan

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln:
    uses: go-rotini/.github/.github/workflows/go-vuln.yml@main

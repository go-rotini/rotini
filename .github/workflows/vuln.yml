# A new advisory for the standard library or a dependency can land between pushes; this scan
# finds it within a week instead of on the next push.
name: Vulnerability scan

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools.sum

      - name: Scan the module and its tools
        run: |
          make vuln
          make vuln-tools

  # Dependabot reads only go.mod, so nothing bumps the tools tools.mod pins. Every go-rotini
  # repository runs this check, so they all fail together when a new release lands, and
  # make tools-upgrade in each one keeps the family on the same versions.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools.sum

      - name: golangci-lint and govulncheck are the latest releases
        run: |
          STALE=0
          for MOD in github.com/golangci/golangci-lint/v2 golang.org/x/vuln; do
            PINNED=$(go list -modfile=tools.mod -m -f '{{.Version}}' "$MOD")
            LATEST=$(go list -m -f '{{.Version}}' "$MOD@latest")
            if [ "$PINNED" != "$LATEST" ]; then
              echo "::error::tools.mod pins $MOD $PINNED, but $LATEST is out; run make tools-upgrade"
              STALE=1
            fi
          done
          exit "$STALE"

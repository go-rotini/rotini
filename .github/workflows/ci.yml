name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: go-rotini/.github/.github/workflows/go-ci.yml@main
    with:
      jobs: |
        - name: test
          run: make test
          os: [ubuntu-latest, macos-latest, windows-latest]
          artifact: test.out
        - name: acceptance
          run: make test-acceptance
        - name: lint
          run: |
            make lint
            GOOS=plan9 GOARCH=amd64 go build .
            GOOS=freebsd GOARCH=amd64 go build ./...
            GOOS=openbsd GOARCH=amd64 go build ./...
        - name: generated
          run: make check-generated
        - name: fuzz
          run: make test-fuzz
        - name: conformance
          run: make test-conformance
          os: [ubuntu-latest, macos-latest, windows-latest]
        # The completion rigs drive the shells installed here; the e2e tier runs the go.mod toolchain.
        - name: e2e
          os: [ubuntu-latest, macos-latest, windows-latest]
          run: |
            case "$RUNNER_OS" in
              Linux)
                sudo apt-get update
                sudo apt-get install -y fish powershell || sudo apt-get install -y fish
                NU_VERSION=0.116.0
                curl -fsSL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION}-x86_64-unknown-linux-gnu.tar.gz" |
                  tar -xz -C "$RUNNER_TEMP"
                export PATH="$RUNNER_TEMP/nu-${NU_VERSION}-x86_64-unknown-linux-gnu:$PATH"
                nu --version
                test "$(GOTOOLCHAIN=local go env GOVERSION)" = "$(awk '/^toolchain /{print $2}' go.mod)"
                ;;
              macOS)
                brew install fish powershell/tap/powershell || brew install fish
                ;;
            esac
            make test-e2e
        - name: completion-shells
          run: make test-completion-shells
        - name: benchmark
          run: make test-bench
          artifact: test_bench.out
        - name: race
          run: make test-race
          os: [ubuntu-latest, macos-latest, windows-latest]

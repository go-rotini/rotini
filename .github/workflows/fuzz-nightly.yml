# The config editor's fuzz targets for ten minutes each, every night. Pushes run every fuzz
# target for 60 seconds (make test-fuzz); this longer run reaches inputs a short one doesn't.
# A failing input is kept as an artifact: put it under the package's testdata/fuzz/<target>/ to
# reproduce it with go test.
name: Nightly fuzz

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { package: ./internal/cfgedit, name: FuzzEdit }
          - { package: ./internal/codegen, name: FuzzFormat }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE: ${{ matrix.target.package }}
      TARGET: ${{ matrix.target.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      # go test -fuzz exits 0 when no target matches, so a renamed target would drop out silently.
      - name: Check the target exists
        run: |
          if ! go test -list "^${TARGET}\$" "$PACKAGE" | grep -qx "$TARGET"; then
            echo "::error::$TARGET is not a fuzz target in $PACKAGE; update the matrix"
            exit 1
          fi

      # go test can race with its own deadline and fail with a bare "context deadline exceeded"
      # and no failing input; as in make test-fuzz, that outcome counts as a pass.
      - name: Fuzz for 10 minutes
        run: |
          set +e
          go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime=10m "$PACKAGE" 2>&1 | tee fuzz.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q '^    context deadline exceeded$' fuzz.log && ! grep -q 'Failing input written' fuzz.log; then
              echo "fuzz time elapsed; deadline race in go test, no failing input"
              exit 0
            fi
            exit "$status"
          fi

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target.name }}
          path: ${{ matrix.target.package }}/testdata/fuzz/${{ matrix.target.name }}/
          if-no-files-found: ignore

# Every fuzz target for ten minutes each, every night. A failing input is kept as an artifact:
# put it under the package's testdata/fuzz/<target>/ to reproduce it with go test.
name: Nightly fuzz

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: go-rotini/.github/.github/workflows/go-fuzz-nightly.yml@main
    with:
      # The config editor and the spec formatter; the other targets run on every push.
      targets: |
        - { package: ./internal/cfgedit, name: FuzzEdit }
        - { package: ./internal/codegen, name: FuzzFormat }

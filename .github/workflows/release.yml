name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Release exactly the commit CI tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # When main has moved past the tested commit, the newer commit's own CI run releases it.
      - name: Check the tested commit is still the tip of main
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $tip, past the tested commit $TESTED_SHA; its own CI run releases it"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.tip.outputs.current == 'true'
        with:
          go-version-file: go.mod

      - name: Determine version
        if: steps.tip.outputs.current == 'true'
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry: true

      # A BREAKING CHANGE commit makes semantic-release propose the next major. A v2+ tag is
      # uninstallable while the module path has no /v2 suffix: `go get @latest` keeps resolving
      # the last v1, and `@v2.0.0` is rejected. Refuse the release rather than publish a tag no
      # user can fetch. Moving to v2 means changing the module path first, then this check.
      - name: Refuse a major version the module path cannot carry
        if: steps.semrel.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          if [ "${VERSION%%.*}" != "1" ]; then
            echo "::error::semantic-release proposed v${VERSION}, but github.com/go-rotini/rotini can only publish v1.x; a v2 needs the module path changed to .../v2 first"
            exit 1
          fi

      - name: Generate SBOM
        if: steps.semrel.outputs.version != ''
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM provenance
        if: steps.semrel.outputs.version != ''
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: sbom.spdx.json

      - name: Create draft release
        if: steps.semrel.outputs.version != ''
        run: |
          gh release create v${{ steps.semrel.outputs.version }} \
            --target "$TESTED_SHA" \
            --draft \
            --generate-notes \
            sbom.spdx.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        if: steps.semrel.outputs.version != ''
        run: gh release edit v${{ steps.semrel.outputs.version }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Install and use the module as published, on every OS.
  fidelity:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/release-fidelity.yml
    with:
      version: v${{ needs.release.outputs.version }}

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: go-rotini/.github/.github/workflows/go-release.yml@main

  # Install and use the module as published, on every OS.
  fidelity:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/release-fidelity.yml
    with:
      version: v${{ needs.release.outputs.version }}

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Determine version
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry: true

      # A BREAKING CHANGE commit makes semantic-release propose the next major. A v2+ tag is
      # uninstallable while the module path has no /v2 suffix: `go get @latest` keeps resolving
      # the last v1, and `@v2.0.0` is rejected. Refuse the release rather than publish a tag no
      # user can fetch. Moving to v2 means changing the module path first, then this check.
      - name: Refuse a major version the module path cannot carry
        if: steps.semrel.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          if [ "${VERSION%%.*}" != "1" ]; then
            echo "::error::semantic-release proposed v${VERSION}, but github.com/go-rotini/rotini can only publish v1.x; a v2 needs the module path changed to .../v2 first"
            exit 1
          fi

      - name: Generate SBOM
        if: steps.semrel.outputs.version != ''
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM provenance
        if: steps.semrel.outputs.version != ''
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: sbom.spdx.json

      - name: Create draft release
        if: steps.semrel.outputs.version != ''
        run: |
          gh release create v${{ steps.semrel.outputs.version }} \
            --draft \
            --generate-notes \
            sbom.spdx.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        if: steps.semrel.outputs.version != ''
        run: gh release edit v${{ steps.semrel.outputs.version }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

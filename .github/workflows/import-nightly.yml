# Imports the importer's pinned large real programs, Delve and kubectl, every night, then
# validates, regenerates and builds each imported CLI. Their modules are downloaded, so this
# runs nightly rather than on every push.
name: Nightly import

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-network:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The imported modules build with GOTOOLCHAIN=local, so install the go.mod toolchain.
      - name: Read the go.mod toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(awk '/^toolchain /{sub(/^go/, "", $2); print $2}' go.mod)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}

      - name: Import Delve and kubectl
        env:
          ROTINI_IMPORT_NETWORK: '1'
        run: go test -count=1 -timeout=50m -run TestImportCobraNetwork -v ./e2e

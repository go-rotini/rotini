# The release-fidelity gate: test the module as it was published, not the working tree.
#
# Every other job tests the working tree: the e2e tier wires each scratch module to it with a
# `replace`, and the unit tiers import it directly. None of them can see a missing //go:embed
# asset, a template left out of the module, a broken `tool` directive, or a $schema URL that
# does not resolve at the tag, because none of them installs the published module.
name: Release fidelity

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to verify (e.g. v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  install-and-use:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      # Deliberately not actions/checkout: this job must not have the source tree available,
      # or a mistake could resolve against it instead of the module cache.
      - name: Scaffold a scratch module and use the published tool
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fidelity" && cd "$RUNNER_TEMP/fidelity"
          go mod init example.com/fidelity

          # The real user path: one module, two faces, one version.
          go get -tool "github.com/go-rotini/rotini/cmd/rotini@${VERSION}"
          go get "github.com/go-rotini/rotini@${VERSION}"

          # The tool must report the version it was installed at. That comes from the module
          # version recorded at build time, since `go tool` passes no -ldflags stamp. A v0.0.0
          # here means the binary lost track of its own release, and the version check on
          # every spec and conf would silently switch off.
          got=$(go tool rotini version | tr -d '\r')
          if [ "$got" != "$VERSION" ]; then
            echo "::error::go tool rotini version printed '$got', want '$VERSION'"
            exit 1
          fi

          go tool rotini init fidelity

          # init stamps that same version, without the v, into the documents it seeds.
          for doc in cmd/fidelity/.rotini.spec.yaml cmd/fidelity/.rotini.conf.yaml; do
            if ! grep -qx "version: ${VERSION#v}" "$doc"; then
              echo "::error::$doc does not declare version: ${VERSION#v}"
              exit 1
            fi
          done

          go mod tidy
          go build ./...

          # The seeded CLI must be usable, not merely compilable: --help has to work.
          go build -o fidelity ./cmd/fidelity
          ./fidelity --help
          ./fidelity version
          ./fidelity help version

      - name: The published $schema URL must resolve
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          for schema in schema-spec.json schema-conf.json; do
            url="https://raw.githubusercontent.com/go-rotini/rotini/refs/tags/${VERSION}/${schema}"
            echo "→ $url"
            # An editor following this URL gets a 404 in silence, so the gate is here.
            curl -fsSL "$url" | head -c 200 > /dev/null
          done

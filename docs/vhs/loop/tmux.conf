# tmux for rotini-loop.tape only: a plain split terminal in the site's Gruvbox colors, with no
# status bar and no shell startup files.
set -g default-shell /bin/bash
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g status off
set -g escape-time 0
set -g pane-border-lines single
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#504945"
set -g window-style "bg=#282828,fg=#ebdbb2"
set -g window-active-style "bg=#282828,fg=#ebdbb2"

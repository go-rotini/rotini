# Every key the conf accepts, in one valid file. `rotini validate` checks it on every test run.
$schema: ./.rotini-schema.conf.json
version: 1.3.0
generate:
  schemas:
    conf:
      file: cmd/deploy/.rotini-schema.conf.json
    spec:
      file: cmd/deploy/.rotini-schema.spec.json
    output:
      dir: cmd/deploy/schemas/output
    config:
      dir: cmd/deploy/schemas/config
  packages:
    - type: main
      file: cmd/deploy/main.go
    - type: cmd
      file: internal/cmd/deploy/zz_rotini.go
      package: deploy
      header: "// Copyright 2026 Example, Inc."
      keep: [store.go]
    - type: models
      file: internal/models/zz_models.go
      package: models
  features:
    - type: help
      enabled: true
      embed: true
      embed_dir: internal/cmd/deploy/help
      template: true
      template_dir: internal/cmd/deploy/templates
    - type: completion
      enabled: true
      messages: all
      messages_env: DEPLOY_COMPLETION_MESSAGES
      descriptions_env: DEPLOY_COMPLETION_DESCRIPTIONS
      install_dir: share
    - type: man
      enabled: false
      section: 1
    - type: markdown
      enabled: true
    - type: tools
      enabled: true
      file: tools/
      targets: [mcp, openai-strict, gemini]
      mcp_revision: 2026-07-28
      go: true
    - type: skill
      enabled: true
      name: deploy
      description: Use when the user asks to ship, roll back or inspect a service.
    - type: llms
      enabled: true
      file: llms.txt
      base_url: https://deploy.example.com/docs/cli/
    - type: permissions
      enabled: true
      file: agents/
      harnesses: [claude, codex, gemini]
  contract:
    file: cmd/deploy/cli-contract.json
    go: true
  dry_run_env: CI
validate:
  fail: collect
  flags_first: false
  posix_names: false
  release_env: RELEASE
diff:
  accept:
    - rule: COMMAND_NO_DELETE
      where: deploy rollback
      reason: replaced by deploy undo

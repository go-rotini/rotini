baseURL = "https://rotini.dev/"
languageCode = "en-us"
title = "rotini"

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML", "RSS"]

[outputFormats.RSS]
  baseName = "rss"

disableKinds = ["taxonomy"]

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

# The spec and conf pages show rotini's JSON Schemas verbatim, straight from the published files
# at the repository root, so the site can never show a stale copy. Declaring a mount for
# `assets` replaces Hugo's default one, so the site's own assets directory is mounted again too.
[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = ".."
  target = "assets/schemas"
  files = ["schema-spec.json", "schema-conf.json"]

version: "2"
linters:
  default: all
  disable:
    - wsl
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
    - spancheck
    - zerologlint
    - loggercheck
    - promlinter
    - protogetter
    - ginkgolinter
    - testifylint
    - sloglint
    - unqueryvet
    - arangolint
    - gosmopolitan
    - exhaustruct
    - exhaustruct_v5 # the v2.13 rename; disabled for the same reason as exhaustruct
    - varnamelen
    - wsl_v5
    - nlreturn
    - noinlineerr
    - godox
    - depguard
    - goheader
    - gomodguard
    - lll
    - gochecknoglobals
    - ireturn
    - nonamedreturns
    - paralleltest
    - tparallel
    - testpackage
    - mnd
    - funcorder
    - containedctx
    - tagliatelle
    - forbidigo
    - exhaustive
    - recvcheck
    - err113
    - goconst
  settings:
    cyclop:
      max-complexity: 25
    gocognit:
      min-complexity: 40
    gocyclo:
      min-complexity: 25
    funlen:
      lines: 120
      statements: 80
      ignore-comments: true
    nestif:
      min-complexity: 10
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - unnamedResult
        - importShadow
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    errcheck:
      check-type-assertions: false
      check-blank: true
      exclude-functions:
        # AsType returns (E, bool) with E constrained to error, so discarding the
        # value reads to errcheck as dropping an error. The bool IS the check.
        - errors.AsType
    gosec:
      excludes:
        # Scheduling jitter (Scheduler.next) uses math/rand deliberately: it
        # spreads ticks, it is never a security decision.
        - G404
        - G304
        - G115
        - G301
        - G306
        - G204
        - G107
    nakedret:
      max-func-lines: 10
    misspell:
      locale: US
    interfacebloat:
      max: 5
    wrapcheck:
      ignore-interface-regexps:
        - "io\\.Writer"
        - "io\\.Reader"
        - "io\\.Closer"
      ignore-sig-regexps:
        - "io\\.Writer\\)\\.Write"
        # The counterpart of the Write entry above: an io.Reader's own Read error is
        # already the most specific thing there is to return, and wrapping it would hide
        # io.EOF behind prose that every caller then has to unwrap again.
        - "io\\.Reader\\)\\.Read"
        - "\\(\\*os\\.PathError\\)"
      ignore-package-globs:
        - "strconv"
        - "encoding/hex"
        - "encoding/base64"
    perfsprint:
      strconcat: false
    godot:
      scope: toplevel
    maintidx:
      under: 15
    prealloc:
      simple: true
      for-loops: true
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - forcetypeassert
          - dupl
          - cyclop
          - gocognit
          - gocyclo
          - funlen
          - goconst
          - maintidx
          - wrapcheck
          - err113
          - exhaustive
          - makezero
          - unparam
          - nestif
          - godot
          - gocritic
          - prealloc
          - perfsprint
          - errorlint
          - inamedparam
          - embeddedstructfieldcheck
          - modernize
          - unconvert
          - revive
          - misspell
          - intrange
          - testableexamples
          - staticcheck
          - tagalign
          - errchkjson
          - thelper # table-driven check closures take *testing.T but aren't helpers
          - errname # test-local sentinels (acmeBinErr) don't need errXxx naming
          - usetesting # os.MkdirTemp/os.Setenv in fixtures predate t.TempDir/t.Setenv
          - mirror # strings.Contains on []byte in assertions is fine
          - ineffassign # throwaway assignments in test scaffolding
          - wastedassign # ditto — reassigned scratch vars in test scaffolding
          - dupword # repeated words in fixture data ("scan\tscan things") are intentional
          - govet # "cannot inline" noise on generic test helpers
      - path: parser\.go
        linters:
          - errname
          - forcetypeassert
          - nilnil
      - path: deprecation\.go
        linters:
          - errname
      - path: input_reader\.go
        linters:
          - wrapcheck
          - errcheck
          - gosec
          - unparam
          - prealloc
      - path: inputs\.go
        linters:
          - errcheck
      - path: definition\.go
        linters:
          - embeddedstructfieldcheck
          - gocheckcompilerdirectives
      # generate_completion.go is almost entirely SHELL source held in Go string
      # literals, so Go prose linters read it as prose it is not: fish's block
      # terminators are a row of "end" lines, not a duplicated word.
      - path: internal/codegen/generate_completion\.go
        linters:
          - dupword
      - path: cmd/
        linters:
          - wrapcheck
          - errcheck
          - gosec
          - dupl
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
